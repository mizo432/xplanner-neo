<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Edit Person</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1 th:if="${person.id != null and person.id > 0}">Edit Person</h1>
        <h1 th:unless="${person.id != null and person.id > 0}">Add Person</h1>
    </span>

    <form th:action="${person.id != null and person.id > 0} ? @{/people/{id}(id=${person.id})} : @{/people}" 
          th:object="${person}" 
          method="post">
        <input type="hidden" th:field="*{id}"/>
        
        <table class="objecttable">
            <tr>
                <th><label for="name">Name</label></th>
                <td><input type="text" id="name" th:field="*{name}" required/></td>
            </tr>
            <tr>
                <th><label for="email">Email</label></th>
                <td><input type="email" id="email" th:field="*{email}"/></td>
            </tr>
            <tr>
                <th><label for="loginName">Login Name</label></th>
                <td><input type="text" id="loginName" th:field="*{loginName}"/></td>
            </tr>
        </table>

        <div class="links">
            <button type="submit">Save</button>
            <a th:href="@{/people}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
