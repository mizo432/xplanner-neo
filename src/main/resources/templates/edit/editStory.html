<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Edit Story</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1 th:if="${story.id != null and story.id > 0}">Edit Story</h1>
        <h1 th:unless="${story.id != null and story.id > 0}">Add Story</h1>
    </span>

    <form th:action="${story.id != null and story.id > 0} ? @{/stories/{id}(id=${story.id})} : @{/stories}" 
          th:object="${story}" 
          method="post">
        <input type="hidden" th:field="*{id}"/>
        
        <table class="objecttable">
            <tr>
                <th><label for="name">Name</label></th>
                <td><input type="text" id="name" th:field="*{name}" required/></td>
            </tr>
            <tr>
                <th><label for="description">Description</label></th>
                <td><textarea id="description" th:field="*{description}"></textarea></td>
            </tr>
            <tr>
                <th><label for="priority">Priority</label></th>
                <td>
                    <select id="priority" th:field="*{priority}">
                        <option value="1">High</option>
                        <option value="2">Medium</option>
                        <option value="3">Low</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th><label for="estimate">Estimate</label></th>
                <td><input type="number" id="estimate" th:field="*{estimate}"/></td>
            </tr>
        </table>

        <div class="links">
            <button type="submit">Save</button>
            <a th:href="@{/stories(iterationId=${iterationId})}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
