<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Edit File</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1 th:if="${file.id != null and file.id > 0}">Edit File</h1>
        <h1 th:unless="${file.id != null and file.id > 0}">Add File</h1>
    </span>

    <form th:action="${file.id != null and file.id > 0} ? @{/files/{id}(id=${file.id})} : @{/files}" 
          th:object="${file}" 
          method="post"
          enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}"/>
        
        <table class="objecttable">
            <tr>
                <th><label for="name">Name</label></th>
                <td><input type="text" id="name" th:field="*{name}" required/></td>
            </tr>
            <tr>
                <th><label for="description">Description</label></th>
                <td><textarea id="description" th:field="*{description}"></textarea></td>
            </tr>
            <tr>
                <th><label for="fileData">File</label></th>
                <td><input type="file" id="fileData" name="fileData"/></td>
            </tr>
        </table>

        <div class="links">
            <button type="submit">Save</button>
            <a th:href="@{/files}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
