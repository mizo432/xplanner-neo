<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Edit Project</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1 th:if="${project.id != null and project.id > 0}">Edit Project</h1>
        <h1 th:unless="${project.id != null and project.id > 0}">Add Project</h1>
    </span>

    <form th:action="${project.id != null and project.id > 0} ? @{/projects/{id}(id=${project.id})} : @{/projects}" 
          th:object="${project}" 
          method="post">
        <input type="hidden" th:field="*{id}"/>
        
        <table class="objecttable">
            <tr>
                <th><label for="name">Name</label></th>
                <td><input type="text" id="name" th:field="*{name}" required/></td>
            </tr>
            <tr>
                <th><label for="description">Description</label></th>
                <td><textarea id="description" th:field="*{description}"></textarea></td>
            </tr>
            <tr>
                <th><label for="hidden">Hidden</label></th>
                <td><input type="checkbox" id="hidden" th:field="*{hidden}"/></td>
            </tr>
        </table>

        <div class="links">
            <button type="submit">Save</button>
            <a th:href="@{/projects}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
