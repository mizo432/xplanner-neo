<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Edit Role</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1 th:if="${role.id != null and role.id > 0}">Edit Role</h1>
        <h1 th:unless="${role.id != null and role.id > 0}">Add Role</h1>
    </span>

    <form th:action="${role.id != null and role.id > 0} ? @{/roles/{id}(id=${role.id})} : @{/roles}" 
          th:object="${role}" 
          method="post">
        <input type="hidden" th:field="*{id}"/>
        
        <table class="objecttable">
            <tr>
                <th><label for="name">Name</label></th>
                <td><input type="text" id="name" th:field="*{name}" required/></td>
            </tr>
            <tr>
                <th><label for="description">Description</label></th>
                <td><textarea id="description" th:field="*{description}"></textarea></td>
            </tr>
        </table>

        <div class="links">
            <button type="submit">Save</button>
            <a th:href="@{/roles}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
