<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} ?: 'XPlanner Neo'">XPlanner Neo</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css"/>
    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <th:block th:replace="${_additionalHead} ?: ~{}"/>
</head>
<body>
    <div id="header">
        <th:block th:replace="~{layout/header :: header}"/>
    </div>
    
    <div id="content">
        <div class="container">
            <div th:replace="${_content}"/>
        </div>
    </div>
    
    <div id="footer">
        <th:block th:replace="~{layout/footer :: footer}"/>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX for dynamic page interactions -->
    <script src="/webjars/htmx.org/htmx.min.js"></script>
    <th:block th:replace="${_additionalScripts} ?: ~{}"/>
</body>
</html>
