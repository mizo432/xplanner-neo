<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">File</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1 th:text="${file.name}">File Name</h1>
    </span>

    <div class="file-details">
        <table class="objecttable">
            <tr>
                <th>ID</th>
                <td th:text="${file.id}">1</td>
            </tr>
            <tr>
                <th>Name</th>
                <td th:text="${file.name}">File Name</td>
            </tr>
            <tr>
                <th>Content Type</th>
                <td th:text="${file.contentType}">Content Type</td>
            </tr>
            <tr>
                <th>File Size</th>
                <td th:text="${file.fileSize}">File Size</td>
            </tr>
            <tr>
                <th>Directory</th>
                <td th:text="${file.directory != null} ? ${file.directory.name} : '-'">Directory</td>
            </tr>
        </table>
    </div>

    <div class="links">
        <a th:href="@{/files/download/{id}(id=${file.id})}">Download File</a>
        <a th:href="@{/files}">Back to Files</a>
    </div>
</div>
</body>
</html>
