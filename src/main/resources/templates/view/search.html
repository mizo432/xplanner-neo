<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Search Results</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1>Search Results</h1>
    </span>

    <form th:action="@{/search}" method="get">
        <input 
            type="text" 
            name="q" 
            th:value="${query}" 
            placeholder="Search..."
            id="search-query"
            hx-get="@{/search/results-fragment}"
            hx-trigger="changed delay:500ms"
            hx-target="#search-results"
            hx-indicator="#search-indicator"
        />
        <button type="submit">Search</button>
        <span id="search-indicator" class="htmx-indicator">Loading...</span>
    </form>

    <div id="search-results">
        <div th:if="${results != null and !results.isEmpty()}">
            <ul>
                <li th:each="result : ${results}">
                    <span th:text="${result}"></span>
                </li>
            </ul>
        </div>
        <div th:if="${results == null or results.isEmpty()}">
            <p>No results found.</p>
        </div>
    </div>
</div>
</body>
</html>
