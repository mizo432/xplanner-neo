<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Tasks</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1>Tasks</h1>
    </span>

    <div id="tasks-list" 
         th:attr="hx-get=@{/tasks/list-fragment(iterationId=${iterationId},personId=${personId})}"
         hx-trigger="load"
         hx-swap="innerHTML"
         hx-target="this">
        <!-- HTMX will load the tasks list here -->
    </div>

    <div class="links">
        <a th:href="@{/tasks/edit(iterationId=${iterationId})}">Add Task</a>
        <a th:if="${iterationId != null}" th:href="@{/iterations/{id}(id=${iterationId})}">Back to Iteration</a>
        <a th:if="${personId != null}" th:href="@{/people/{id}(id=${personId})}">Back to Person</a>
    </div>
</div>
</body>
</html>
