<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Notes</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1>Notes</h1>
    </span>

    <div th:if="${notes != null and !notes.empty}">
        <table class="objecttable">
            <thead>
                <tr>
                    <th>Actions</th>
                    <th>ID</th>
                    <th>Subject</th>
                    <th>Author</th>
                    <th>Submission Time</th>
                    <th>Has Attachment</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="note : ${notes}">
                    <td>
                        <a th:href="@{/notes/{id}/edit(id=${note.id})}" class="image edit">Edit</a>
                    </td>
                    <td>
                        <a th:href="@{/notes/{id}(id=${note.id})}" th:text="${note.id}">1</a>
                    </td>
                    <td>
                        <a th:href="@{/notes/{id}(id=${note.id})}" th:text="${note.subject}">Subject</a>
                    </td>
                    <td th:text="${note.authorId}">Author</td>
                    <td th:text="${note.submissionTime}">Submission Time</td>
                    <td th:text="${note.file != null} ? 'Yes' : 'No'">No</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${notes == null or notes.empty}">
        <span class="highlighted_message">No notes found.</span>
    </div>

    <div class="links">
        <a th:href="@{/notes/edit(attachedToId=${attachedToId})}">Add Note</a>
    </div>
</div>
</body>
</html>
