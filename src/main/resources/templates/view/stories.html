<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Stories</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1>Stories</h1>
    </span>

    <div id="stories-list" 
         th:attr="hx-get=@{/stories/list-fragment(iterationId=${iterationId})}"
         hx-trigger="load"
         hx-swap="innerHTML"
         hx-target="this">
        <!-- HTMX will load the stories list here -->
    </div>

    <div class="links">
        <a th:href="@{/stories/edit(iterationId=${iterationId})}">Add Story</a>
        <a th:href="@{/iterations/{id}(id=${iterationId})}">Back to Iteration</a>
    </div>
</div>
</body>
</html>
