<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Role</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1 th:text="${role.name}">Role Name</h1>
    </span>

    <div class="role-details">
        <table class="objecttable">
            <tr>
                <th>ID</th>
                <td th:text="${role.id}">1</td>
            </tr>
            <tr>
                <th>Name</th>
                <td th:text="${role.name}">Role Name</td>
            </tr>
            <tr>
                <th>Left</th>
                <td th:text="${role.left}">Left</td>
            </tr>
            <tr>
                <th>Right</th>
                <td th:text="${role.right}">Right</td>
            </tr>
        </table>
    </div>

    <div class="links">
        <a th:href="@{/roles}">Back to Roles</a>
    </div>
</div>
</body>
</html>
