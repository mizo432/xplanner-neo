<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Projects</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1 th:text="#{projects.title}">Projects</h1>
    </span>

    <div id="projects-list" 
         hx-get="/projects/list-fragment" 
         hx-trigger="load"
         hx-swap="innerHTML"
         hx-target="this">
        <!-- HTMX will load the projects list here -->
    </div>

    <div class="links">
        <a th:href="@{/projects/edit}" th:text="#{projects.link.add_project}">Add Project</a>
        <a th:href="@{/people}" th:text="#{projects.link.people}">People</a>
        <a th:href="@{/timesheets/aggregate}" th:text="#{projects.link.aggregate.timesheet}">Aggregate Timesheet</a>
    </div>
</div>
</body>
</html>
