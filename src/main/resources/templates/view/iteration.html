<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Iteration</title>
</head>
<body>
<div layout:fragment="content">
    <span class="title">
        <h1 th:text="${iteration.name}">Iteration Name</h1>
    </span>

    <div class="iteration-details">
        <table class="objecttable">
            <tr>
                <th>ID</th>
                <td th:text="${iteration.id}">1</td>
            </tr>
            <tr>
                <th>Name</th>
                <td th:text="${iteration.name}">Iteration Name</td>
            </tr>
            <tr>
                <th>Description</th>
                <td th:text="${iteration.description}">Description</td>
            </tr>
            <tr>
                <th>Start Date</th>
                <td th:text="${iteration.startDate}">Start Date</td>
            </tr>
            <tr>
                <th>End Date</th>
                <td th:text="${iteration.endDate}">End Date</td>
            </tr>
            <tr>
                <th>Status</th>
                <td th:text="${iteration.status}">Status</td>
            </tr>
        </table>
    </div>

    <div class="links">
        <a th:href="@{/iterations/{id}/edit(id=${iteration.id})}">Edit Iteration</a>
        <a th:href="@{/iterations(projectId=${iteration.project.id})}">Back to Iterations</a>
        <a th:href="@{/stories(iterationId=${iteration.id})}">Stories</a>
        <a th:href="@{/tasks(iterationId=${iteration.id})}">Tasks</a>
    </div>
</div>
</body>
</html>
